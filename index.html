 if(G)for(const i of G.it){if(i.g)continue;const x=X(i.x);if(x<-30||x>830)continue;c.font='30px serif';c.save();c.shadowColor='#ff0';c.shadowBlur=14;c.fillText({c:'☕',p:'🧻',t:'👟',d:'🩲',w:'🚽'}[i.t],x,GY-18+Math.sin(t*6+i.x)*4);c.restore()}
 let po='idle',px=180,al=1,tm=t;
 if(!G){tm=performance.now()/300}else if(G.sv=='win'){po='win';const tx=Math.min(L+55,G.p+S*.7*ft);px=180+tx-G.p;po=tx<L+55?'run':'win';al=Math.max(0,Math.min(1,(L+55-tx)/20));tm=ft*2}
 else if(G.sv=='lose'){po=ft<1.5?'look':'lose';if(ft<.8)po='idle'}
 else if(G.st>0)po='stum';else if(G.h>0)po='jump';else if(G.sl)po='slide';else if(t>25)po='panic';else po='run';
 const by=G?GY-Math.max(0,G.h):GY;if(!G){const d=c.createRadialGradient(660,GY-40,5,660,GY-40,90);d.addColorStop(0,'#fff');d.addColorStop(1,'#fff0');c.fillStyle=d;c.fillRect(560,GY-150,200,200);c.font='70px serif';c.fillText('🚽',660,GY)}
 c.globalAlpha=al;if(G&&G.dia>0){c.strokeStyle='#4fc3f7';c.lineWidth=3;c.beginPath();c.arc(px,by-45,50,0,7);c.stroke()}
 if(G&&G.bm>1){c.strokeStyle='#fff8';c.lineWidth=3;for(let i=0;i<4;i++){c.beginPath();c.moveTo(px-40-i*14,by-20-i*14);c.lineTo(px-90-i*14,by-20-i*14);c.stroke()}}
 T(px,by,po,tm,G?pp:.2);c.globalAlpha=1;
 for(const q of P){c.globalAlpha=Math.max(0,q.l);if(q.k=='cf'){c.fillStyle=q.c;c.fillRect(q.x,q.y,7,4)}else{c.font='34px serif';c.fillText('💩',q.x,q.y)}}c.globalAlpha=1;
 if(mode=='lose'&&ft>1.5){const a=Math.min(1,(ft-1.5)*1.5);c.globalAlpha=a*.8;c.font='170px serif';c.fillText('💨',px+30,GY-20);c.fillStyle='#5a3418';c.globalAlpha=a*.5;c.beginPath();c.arc(px,GY-40,90*a,0,7);c.fill();c.globalAlpha=1}

  c.textAlign='center';c.font='900 52px Trebuchet MS';c.lineWidth=7;c.strokeStyle='#000';c.strokeText(clock(G),400,52);c.fillStyle=col;c.fillText(clock(G),400,52);
  const v=pr(G),bx=16,bw=210;c.fillStyle='#000a';c.fillRect(bx,10,bw+8,36);c.fillStyle=v<25?'#4cd964':v<50?'#ffd60a':v<75?'#ff9f0a':v<99.5?'#ff3b30':'#a0005a';c.fillRect(bx+4,26,bw*v/100,16);c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(bx+4,26,bw,16);

  if(bubT>0){c.globalAlpha=Math.min(1,bubT*2);c.textAlign='center';c.font='900 26px Trebuchet MS';c.strokeStyle='#000';c.lineWidth=6;c.fillStyle='#ffd23f';c.strokeText(bub,400,100);c.fillText(bub,400,100);c.globalAlpha=1}}

/* lógica de jogo */
function ui(on){['start','end','pause'].forEach(k=>$(k).classList.toggle('on',k==on));document.body.classList.toggle('pl',on==='')}
function refresh(){$('stt').textContent=ST.n?'Recorde: '+ST.bs+' pts · Melhor tempo: '+(ST.bt?ST.bt.toFixed(1)+'s':'—')+' · '+ST.w+' vitórias · '+ST.l+' derrotas · '+ST.n+' tentativas':'Ainda sem recordes. Boa sorte, Tiago!';$('goi').style.display=ST.un?'':'none'}
function start(i){au();iron=i;G=mk(i);mode='play';acc=0;ft=0;P=[];shake=0;zi=-1;callT=3;bubT=0;hb=0;bt=0;gotEnd=false;sld=0;ui('');ST.n++;save();last=performance.now()}
function endGame(){gotEnd=true;const w=G.sv=='win',s=score(G);if(w){ST.w++;ST.un=1;if(!ST.bt||G.t<ST.bt)ST.bt=G.t}else ST.l++;if(s>ST.bs)ST.bs=s;save();refresh();
 $('et').textContent=w?'MISSÃO CUMPRIDA!':'FIM DE JOGO!';$('es').textContent=w?'O TIAGO SALVOU A RETAGUARDA!':'O TIAGO NÃO AGUENTOU! 💩';
 $('er').textContent=w?rank(G)+' · '+G.t.toFixed(2)+'s · '+s+' pts':LOSE[Math.floor(Math.random()*LOSE.length)];$('ex').textContent=w?(ST.un&&!iron?'🔓 Desbloqueaste: MODO INTESTINO DE AÇO!':''):'Pontuação: '+s;
 $('again').textContent=w?'JOGAR NOVAMENTE':'TENTAR NOVAMENTE';ui('end')}
function shareIt(){const w=G.sv=='win',txt='💩 ACABEI DE JOGAR OPERAÇÃO: SALVEM O TIAGO!\n\n'+(w?'Consegui chegar ao WC com '+Math.max(0,30-G.t).toFixed(1)+' segundos restantes! ('+rank(G)+')\n\nO Tiago sobreviveu!':'O Tiago não aguentou... estava a '+Math.max(0,Math.round((G.L-G.p)/10))+' dm da sanita!')+'\n\nAchas que consegues salvar o Tiago também?\n'+location.href;
 if(navigator.share)navigator.share({text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>{$('share').textContent='COPIADO!'}).catch(()=>prompt('Copia:',txt));else prompt('Copia:',txt)}
function pause(){if(mode=='play'){mode='pause';ui('pause')}}
function resume(){if(mode=='pause'){mode='play';acc=0;last=performance.now();ui('')}}
function jump(){if(mode=='play'&&G)G.jb=.12}
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.25,Math.max(0,(ts-last)/1000||0));last=ts;
 if(mode=='menu'||mode=='pause'&&0)mp+=dt*140;
 if(mode=='play'){acc+=dt;let n=0;while(acc>=STEP&&G.sv=='run'&&n++<60){step(G,sld>0||keyS>0,STEP);acc-=STEP}
  for(const e of G.ev){if(e=='hit'){shake=9;snd('hit');bubT=.8;bub='AI!!!'}else if(e=='shield'){shake=4;snd('hit')}else if(e=='jump')snd('jump');else if(e=='item'){snd('item');bub='APANHOU!';bubT=.8}else if(e=='land')snd('land');else if(e=='pass'&&G.cmb==6){bub='🔥 IMPARÁVEL! 🔥';bubT=1.6;part(180,250,30,'cf')}}G.ev.length=0;
  const z=zn(G.p/G.L);if(z!=zi){zi=z;bub=ZN[z];bubT=2.2}
  callT-=dt;if(callT<=0){callT=3.4;if(bubT<=0){bub=G.t>25?'O WC ESTÁ ALI!':CALLS[Math.floor(Math.random()*CALLS.length)];bubT=1.6}}
  bt+=dt;const per=G.t>25?.17:G.t>20?.2:.25;if(bt>per){bt=0;const nn=[196,0,262,0,196,247,0,330][Math.floor(G.t/per)%8];if(nn)tn(nn*(G.t>20?1.25:1),.1,'square',.04)}
  hb-=dt;if(G.t>20&&hb<=0){hb=G.t>25?.35:.6;snd('heart')}
  if(G.t>25)shake=Math.max(shake,1.6);else if(G.t>20)shake=Math.max(shake,.6);
  if(G.sv!='run'){mode=G.sv;ft=0;if(mode=='win')snd('win');else shake=0;}}
 else if(mode=='win'||mode=='lose'){ft+=dt;
  if(mode=='win'&&ft>.5&&!P.length&&ft<.6){part(300,80,60,'cf');part(500,80,60,'cf')}
  if(mode=='win'&&ft>.7&&Math.random()<.2)part(100+Math.random()*600,60,3,'cf');
  if(mode=='lose'&&ft>1.5&&ft-dt<=1.5){snd('lose');shake=12;for(let i=0;i<10;i++)part(190,260,1,'po')}
  if(ft>(mode=='win'?2:3)&&!gotEnd)endGame()}
 shake*=.9;if(bubT>0)bubT-=dt;
 for(const q of P){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.k=='cf'?400:700)*dt;q.l-=dt*.5}P=P.filter(q=>q.l>0);
 draw(dt)}
/* entradas */
function tb(el,dn,up){el.addEventListener('pointerdown',e=>{e.preventDefault();au();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('d');dn()});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();if(el.classList.contains('d')){el.classList.remove('d');up()}}))}
tb($('bj'),jump,()=>{});tb($('bs'),()=>{sld++},()=>{sld=Math.max(0,sld-1)});
addEventListener('keydown',e=>{if(e.repeat)return;if(['ArrowUp',' ','w'].includes(e.key)){e.preventDefault();au();if(mode=='menu')start(false);else jump()}else if(['ArrowDown','s'].includes(e.key)){keyS=1}else if(e.key=='p'||e.key=='Escape'){mode=='play'?pause():resume()}else if(e.key=='Enter'&&(mode=='win'||mode=='lose')&&gotEnd)start(iron)});
addEventListener('keyup',e=>{if(['ArrowDown','s'].includes(e.key))keyS=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});addEventListener('blur',pause);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
$('go').onclick=()=>start(false);$('goi').onclick=()=>start(true);$('again').onclick=()=>start(iron);$('share').onclick=shareIt;$('ip').onclick=pause;$('res').onclick=resume;
$('menu').onclick=()=>{mode='menu';G=null;P=[];shake=0;ui('start');refresh()};
$('isn').onclick=()=>{mute=!mute;$('isn').textContent=mute?'🔇':'🔊'};
$('isn').classList.add('on2');
refresh();requestAnimationFrame(t=>{last=t;loop(t)});
})()}
